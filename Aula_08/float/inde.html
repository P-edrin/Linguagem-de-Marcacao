<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>float</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <h2>float</h2>
    <p>serve para mudar a posição do elemento na tela,
        seguindo seu ancestral mais proximo.
    </p>
    <ul>
        <li>Float: left; -> flutuar para esquerda </li>
        <li>Float: right; -> flutuar para direita</li>
        <li>Clear: both; -> Limpar os estilos anteriores </li>
    </ul>

    <br><br>

    <div>
        <h3>float: left;</h3>
        <p class="esquerda">Um texto...</p>
        <img
            src="https://instagram.fcgh1-1.fna.fbcdn.net/v/t51.82787-19/831437395_18126117670848067_6585251054571598495_n.jpg?_nc_cat=105&_nc_map=urlgen_bucketless&ig_cache_key=GFO6jjFDhu2km2VAAJ_ygajxgmNbbmNDAQAB0j-ccb7-5&ccb=7-5&_nc_sid=669407&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy42OTAuQzMifQ%3D%3D&_nc_ohc=54KQCN42k5IQ7kNvwGAoovS&_nc_oc=Adq_sKVu0pH-fDIuloAAILfxstQwj4z1DPCBwFAwXkTZCxDtO-ibk4EVHxV4tjmzbcE&_nc_zt=24&_nc_ht=instagram.fcgh1-1.fna&_nc_gid=xgh5_89dGpcOrf_XNMpeeA&_nc_ss=7b6a8&oh=00_AQTgm86utiQh_zyoRKJ70e4BkuGKJ8a0u7mS7U8tWLcmRA&oe=6AFBF27E">
    </div>
    <div>
        <h3>float: left;</h3>
        <p class="direita">Um texto...</p>
        <img class="direita"
            src="https://instagram.fcgh1-1.fna.fbcdn.net/v/t51.82787-19/831437395_18126117670848067_6585251054571598495_n.jpg?_nc_cat=105&_nc_map=urlgen_bucketless&ig_cache_key=GFO6jjFDhu2km2VAAJ_ygajxgmNbbmNDAQAB0j-ccb7-5&ccb=7-5&_nc_sid=669407&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy42OTAuQzMifQ%3D%3D&_nc_ohc=54KQCN42k5IQ7kNvwGAoovS&_nc_oc=Adq_sKVu0pH-fDIuloAAILfxstQwj4z1DPCBwFAwXkTZCxDtO-ibk4EVHxV4tjmzbcE&_nc_zt=24&_nc_ht=instagram.fcgh1-1.fna&_nc_gid=xgh5_89dGpcOrf_XNMpeeA&_nc_ss=7b6a8&oh=00_AQTgm86utiQh_zyoRKJ70e4BkuGKJ8a0u7mS7U8tWLcmRA&oe=6AFBF27E">
