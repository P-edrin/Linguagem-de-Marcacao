<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Position: relative;</title>
    <style>
        .static {
            position: static;
            border: 3px solid green;
            margin-top: 10%;
        }

        .relative {
            position: relative;
            margin-left: 30px;
            border: 3px solid green;
        }
    </style>
</head>

<body>

    <div class="static">
        Essa div tem o estilo Position: static;
    </div>
    <div class="relative">
        Essa div tem o estilo Position: relative;
    </div>

</body>

</html>
