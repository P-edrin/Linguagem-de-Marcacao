<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>cadastro de usuario</title>
	</head>
	<body>
	<!-- criar formulario 
	<form> - tag de formulario
	Atributo "action aponta para uma pagina 
	Atributo "method":
		-GET: passa os dados pelo URL 
		-POST: passa os dados pelo corpo 
	-->
		<form action ="#" method="POST">
			<!-- Label - rotulo do compo -->
			<label>Nome completo</label>
			<br>
			<!-- INPUT - campo de entrada de dados
			TYPE - tipo de campo 
			id- indentificador (para javaescript)
			NAME - indentificador (para PHP)
			-->
			<input type="text" id="nome" name="nome">
			<br><br>
			<!-- Label - rotulo do compo -->
			<input type="submit" value="cadastrar">
			
		</form>
	<body>
</html>
