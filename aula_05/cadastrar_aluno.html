<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>cadastro do aluno</title>
	</head>
	<body>
		<header>
			<h1 style="text-aling: center">Cadastro de aluno</h1>
			<hr>
		</header>		
			<form action="#" method="POST">
			<label for="nome">Nome do aluno:</label>
			<br>
			<input type="text" id="nome" name="nome" placeholder="Nome do aluno..."minlength="3" maxlength="255"required>
			<br><br>
			
			<label for="ra">Registro do aluno:</label>
			<br>
			<input type="text" id="ra" name="ra" value="20261015" disabled>
			<br><br>
			
			<label for="email">E-mail do aluno:</label>
			<br>
			<input type="email" id="email" name="email" placeholder="email@email.com"required>
			<br><br>
			
			<label for="telefone">telefone do aluno:</label>
			<br>
			<input type="tel" id="telefone" name="telefone" placeholder="(00)0000-0000"required>
			<br><br>
			
			<label for="data_nascimento">data de Nascimento:</label>
			<br>
			<input type="date" id="data_nascimento" name="data_nascimento" max="2009-01-01"required>
			<br><br>
			
			<label for="idade">idade:</label>
			<br>
			<input type="number" id="idade" name="idade" min="17"max="100"required>
			<br><br>
			
			<label for="genero">Gênero</label>
			<br>
			<input type="radio" id "maculino" name="genero" value="maculino"required>Masculino
			<br>
			<input type="radio" id "Feminino" name="genero" value="Feminino">Feminino
			<br>
			<input type="radio" id "Outros" name="genero" value="Outros">Outros
			<br>
			<label for="turma">Selecione a turma:</label>
			<br>
			<select name="turma" id="turma"required>
				<option value="Selecione..."></option>
				<option value="1EMA">1° EM A </option>
				<option value="1EMA">1° EM B </option>
				<option value="2EMA">2° EM A </option>
				<option value="2EMA">2° EM B </option>
				<option value="3EMA">3° EM A </option>
				<option value="3EMA">3° EM B </option>
			</select>
			<br><br>
			<label for="Foto">Foto do aluno:</label>
			<br>
			<input type="file" id="Foto" name="Foto"required>
			<br><br>
			<label for="comentarios">Reclamações, comentarios e elogios...</label>
			<br>
			<textarea id="comentarios" name="comentarios" placeholder="texto..."></textarea>
			<br><br>
			<input type="checkbox" id="termos" name="termos"required>Li e aceitos os termos e condições
			<br>
			<input type="checkbox" id="notificações" name="notificações">Aceito receber notificações
			<br><br>
			<input type="submit" value="cadastrar aluno">
		</form>
	<body>
</html>
