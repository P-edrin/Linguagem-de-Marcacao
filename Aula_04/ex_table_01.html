<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Exemplo 1 - Tabela</title>
</head>

<body>

    <!-- table -> tabela -->
	
    <table border="1" width="100%">
        <!-- thead -> cabeçalho da tabela -->
        <thead style="background-color: green; color: #000000;">
		

            <!-- primeira linha -->
            <tr>
				<th colspan="5">Tabela de Serviços Mecânicos</th>
            </tr>

        </thead>

        <!-- tbody -> corpo da tabela -->
        <tbody>
		
			<tr>
				<th rowspan="5" style="background-color: #1C4020; color: #000000;">Nacionais</th>
                <th>Veiculos</th>
                <th>Serviços</th>
                <th>Tempo Previsto</th>
                <th>valor</th>
			</tr>

            <!-- segunda linha -->
            <tr>
				
                <td>camionete S10</td>
                <td>Suspensão</td>
                <td>3 horas e 25 minutos</td>
                <td>350,00</td>
                
            </tr>

            <!-- terceira linha -->
            <tr>
                <td>Camionete ranger </td>
                <td>Freio</td>
                <td>3horas e 45 minutos</td>
                <td>200,00</td>
                
            </tr>
                   
            <tr>
                <td>Camionete Hilux</td>
                <td>troa de bateria</td>
                <td>30 minutos</td>
                <td>25,00</td>
            </tr>
			
			<tr>
                <td>Camionete D10</td>
                <td>Alinhamento</td>
                <td>1 hora e 40 minutos</td>
                <td>220,00</td>
            </tr>

			
			</tbody>
		</table>
	</body>
</html>
